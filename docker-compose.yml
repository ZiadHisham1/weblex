version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    container_name: weblex-postgres-medusa
    restart: unless-stopped
    environment:
      POSTGRES_USER: medusa
      POSTGRES_PASSWORD: medusa_dev_password
      POSTGRES_DB: medusa_store
    ports:
      - "5433:5432"
    volumes:
      - postgres_medusa_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medusa"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: weblex-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    container_name: weblex-umami
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://medusa:medusa_dev_password@postgres:5432/umami_db
      DATABASE_TYPE: postgresql
      APP_SECRET: change_this_to_a_random_string
    ports:
      - "3001:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_medusa_data:
  redis_data: